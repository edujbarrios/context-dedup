[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "context-dedup"
version = "0.1.0"
description = "Detect and remove redundant context before sending it to an LLM."
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Eduardo J. Barrios", email = "edujbarrios@outlook.com" }]
keywords = ["llm", "rag", "context", "deduplication", "retrieval", "ai", "prompt", "context-window"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/edujbarrios/context-dedup"
Source = "https://github.com/edujbarrios/context-dedup"
Issues = "https://github.com/edujbarrios/context-dedup/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

